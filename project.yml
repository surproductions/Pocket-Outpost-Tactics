name: PocketOutpostTactics
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
packages:
  GameCore:
    path: Packages/GameCore
targets:
  PocketOutpostTactics:
    type: application
    platform: iOS
    sources:
      - path: PocketOutpostTactics
    dependencies:
      - package: GameCore
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    settings:
      base:
        PRODUCT_NAME: PocketOutpostTactics
        PRODUCT_BUNDLE_IDENTIFIER: $(POT_BUNDLE_ID)
        DEVELOPMENT_TEAM: $(POT_TEAM_ID)
        CODE_SIGN_STYLE: $(POT_SIGN_STYLE)
        CODE_SIGN_IDENTITY: $(POT_SIGN_IDENTITY)
        PROVISIONING_PROFILE_SPECIFIER: $(POT_PROFILE)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_FILE: PocketOutpostTactics/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: NO
  PocketOutpostTacticsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PocketOutpostTacticsUITests
    dependencies:
      - target: PocketOutpostTactics
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.surproductions.pocketoutposttactics.uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        TEST_TARGET_NAME: PocketOutpostTactics
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  PocketOutpostTactics:
    build:
      targets:
        PocketOutpostTactics: all
        PocketOutpostTacticsUITests: [test]
    test:
      config: Debug
      targets:
        - PocketOutpostTacticsUITests
    archive:
      config: Release
